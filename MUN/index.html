<!DOCTYPE html><html><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Model United Nations Registration</title>
<link rel='stylesheet' href='style.css'>
</head><body>
<div class='container'><div class='card'>
<h1>🌍 Model United Nations Registration</h1>
<p>Team Event (Maximum 4 Members)</p>
<form id='form'>
<label>
    Team Name
    <input id="teamName" required>
</label>
<label>Team Size
<select id='teamSize'>
<option value='1'>1</option><option value='2'>2</option><option value='3'>3</option><option value='4' selected>4</option>
</select></label>
<div id='members'></div>
<label class='terms'><input type='checkbox' id='agree'> I agree to the event rules.</label>
<button type='submit'>Proceed to Payment →</button>
</form></div></div>
<script src='script.js'></script>
</body></html>
