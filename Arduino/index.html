<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Expo Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card">
<h1>Arduino Expo Registration</h1>
<p class="sub">Team Event (1–3 Members)</p>
<form id="form" novalidate>
<div class="grid">
<label>
    Team Name
    <input id="teamName" required>
</label>
<label>Team Size
<select id="teamSize">
<option value="1">1</option><option value="2">2</option><option value="3">3</option>
</select></label>
</div>
<div id="members"></div>
<label class="terms"><input type="checkbox" id="agree"> I agree to the rules and regulations.</label>
<button type="submit" class="pay">Proceed to Payment →</button>
</form>
</div></div>
<script src="script.js"></script>
</body></html>
