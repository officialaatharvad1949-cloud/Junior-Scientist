<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EzQuizit Registration</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div class="card">
<h1>🧠 EzQuizit Registration</h1><p>Team Event (Maximum 2 Members)</p>
<form id="form" novalidate>
<label>
    Team Name
    <input id="teamName" required>
</label>
<label>Team Size
<select id="team"><option value="1">1</option><option value="2" selected>2</option></select>
</label>
<div id="members"></div>
<label class="check"><input id="agree" type="checkbox"> I agree to the rules.</label>
<button type="submit">Proceed to Payment →</button>
</form></div></div><script src="script.js"></script></body></html>
